name: Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: '3.24.1'
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (major, minor, patch, or specific version string like 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  FLUTTER_VERSION: '3.32.1'
  DART_VERSION: '3.8.1'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump Version
        id: bump
        run: |
          # Run the python script
          python3 scripts/bump_version.py "${{ inputs.version }}"

          # Read the new version from pubspec.yaml to set output
          # Assumes version: X.Y.Z+N
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          # Sanitize strictly if needed, but awk should catch the value.
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Branch and Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Extract semantic version for branch name (remove build number if desired, or keep it)
          # Often release branches are v1.2.3.
          SEMANTIC_VERSION=$(echo $NEW_VERSION | cut -d'+' -f1)
          BRANCH_NAME="release/v${SEMANTIC_VERSION}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          git checkout -b "$BRANCH_NAME"
          git add pubspec.yaml
          git commit -m "Bump version to ${NEW_VERSION}"
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        run: |
          gh pr create \
            --title "Bump version to ${NEW_VERSION}" \
            --body "This PR bumps the version to ${NEW_VERSION}. Automated by Prepare Release workflow." \
            --base main \
            --head "${BRANCH_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION  }}

      - name: Set up environment vars
        shell: bash
        run: |
          TAG_NAME=$(echo ${GITHUB_REF#refs/tags/v})
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Update version number
        shell: bash
        run: |
          choco install sed make yq -y
          yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml

      - name: Build and Release On Windows
        run: |
          flutter pub get
          flutter test
          flutter config --enable-windows-desktop
          dart pub global activate fastforge
          fastforge release --name onwindows
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION  }}

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y appstream clang cmake desktop-file-utils fakeroot fuse gir1.2-appindicator3-0.1 libappindicator3-1 libappindicator3-dev libarchive-tools libgdk-pixbuf2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libjsoncpp25 libjsoncpp-dev libmpv-dev libnotify-bin libnotify-dev libsecret-1-0 libsecret-1-dev libunwind-dev locate make mpv ninja-build patchelf pkg-config python3-pip python3-setuptools strace tar xmlstarlet 

      - name: Install AppImage Tool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mv -v appimagetool /usr/local/bin/

      - name: Set up environment vars
        run: |
          TAG_NAME=$(echo ${GITHUB_REF#refs/tags/v})
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Update version number
        run: |
          curl -sS https://webi.sh/yq | sh
          yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml

      - name: Secrets
        run: |
          echo "${SECRET_FILE}" | base64 -d | tar xvj 
          echo "PLAYSTORE_CREDENTIALS=${PWD}/sendtolinkwarden-e713764ecb3d.json" >> $GITHUB_ENV
        env:
          SECRET_FILE: "${{ secrets.SECRET_FILE }}"

      - name: Build and Release On Linux
        run: |
          flutter pub get
          flutter test
          dart pub global activate fastforge
          fastforge release --name onlinux
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Unsecret
        run: |
          echo "${SECRET_FILE}" | base64 -d | tar -j --list | xargs rm -f
        env:
          SECRET_FILE: "${{ secrets.SECRET_FILE }}"

  macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION  }}

      - name: Dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm install --break-system-packages -g appdmg      

      - name: Set version environment vars
        run: |
          TAG_NAME=$(echo ${GITHUB_REF#refs/tags/v})
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Update version number
        run: |
          brew install yq
          yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml

      - name: Build and Release On Mac OS X
        run: |
          flutter pub get
          flutter test
          flutter config --enable-macos-desktop
          dart pub global activate fastforge
          fastforge release --name onmac
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  extension:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up environment vars
        run: |
          TAG_NAME=$(echo ${GITHUB_REF#refs/tags/v})
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Update version number
        run: |
          curl -sS https://webi.sh/yq | sh
          yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml

      - name: Build Extensions
        run: |
          chmod +x scripts/build_extension.sh
          ./scripts/build_extension.sh
      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: build/extension/chrome_extension.zip
      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: build/extension/firefox_extension.zip

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
      - macos
      - extension
    steps:
      - uses: actions/checkout@v4

      - name: Download Chrome Extension
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension

      - name: Download Firefox Extension
        uses: actions/download-artifact@v4
        with:
          name: firefox-extension

      - name: Upload Extensions to Release
        run: |
          gh release upload "$(echo ${GITHUB_REF#refs/tags/})" chrome_extension.zip firefox_extension.zip
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: No longer draft
        run: |
          gh release edit "$(echo ${GITHUB_REF#refs/tags/})" --draft=false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

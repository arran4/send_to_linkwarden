name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (major, minor, patch, or specific version string like 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump Version
        id: bump
        run: |
          # Run the python script
          python3 scripts/bump_version.py "${{ inputs.version }}"

          # Read the new version from pubspec.yaml to set output
          # Assumes version: X.Y.Z+N
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          # Sanitize strictly if needed, but awk should catch the value.
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Branch and Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Extract semantic version for branch name (remove build number if desired, or keep it)
          # Often release branches are v1.2.3.
          SEMANTIC_VERSION=$(echo $NEW_VERSION | cut -d'+' -f1)
          BRANCH_NAME="release/v${SEMANTIC_VERSION}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          git checkout -b "$BRANCH_NAME"
          git add pubspec.yaml
          git commit -m "Bump version to ${NEW_VERSION}"
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        run: |
          gh pr create \
            --title "Bump version to ${NEW_VERSION}" \
            --body "This PR bumps the version to ${NEW_VERSION}. Automated by Prepare Release workflow." \
            --base main \
            --head "${BRANCH_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/042-simplified-github-ci-release-safe/
# Release safety details:
# https://arran4.github.io/blog/post/2026/041-release-safe-single-owner-github-ci/
# Built using these posts as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 3 1 * *'
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FLUTTER_VERSION: '3.38.7'
  DART_VERSION: '3.10.7'

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_build: ${{ steps.route.outputs.run_build }}
      run_post_release: ${{ steps.route.outputs.run_post_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        run: |
          set -euo pipefail

          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          run_build=false
          run_post_release=false
          is_monthly=false
          is_nightly=false

          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                run_release=true
                run_build=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                run_pr_meta_checks=true
                run_code_checks=true
              fi
              ;;
            workflow_dispatch)
              case "${{ inputs.mode }}" in
                lint-fix)
                  run_code_checks=true
                  is_nightly=true
                  ;;
                build)
                  run_code_checks=true
                  run_build=true
                  ;;
                release-*)
                  run_code_checks=true
                  run_build=true
                  run_release=true
                  ;;
                publish-tag)
                  if [[ "${{ github.ref_type }}" != "tag" || ! "${{ github.ref }}" =~ ^refs/tags/v[0-9]+ ]]; then
                    echo "publish-tag mode requires an eligible tag context (e.g. vX.Y.Z)" >&2
                    false
                  fi
                  run_code_checks=true
                  run_build=true
                  run_release=true
                  ;;
                monthly-maintenance)
                  run_code_checks=true
                  is_monthly=true
                  ;;
              esac
              ;;
            release)
              run_post_release=true
              ;;
            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
                is_monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "41 2 * * *" ]]; then
                is_nightly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_post_release=$run_post_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover capabilities and cost profile
    needs: route
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_dart: ${{ steps.detect.outputs.has_dart }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_qt_cpp: ${{ steps.detect.outputs.has_qt_cpp }}
      has_make_c: ${{ steps.detect.outputs.has_make_c }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_goreleaser: ${{ steps.detect.outputs.has_goreleaser }}
      has_dart_or_flutter_tests: ${{ steps.detect.outputs.has_dart_or_flutter_tests }}
      has_packaging: ${{ steps.detect.outputs.has_packaging }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        env:
          EXPECT_GO: false
          EXPECT_NODE: false
          EXPECT_DART: false
          EXPECT_FLUTTER: true
          EXPECT_QT_CPP: false
          EXPECT_MAKE_C: false
          EXPECT_DOCKER: false
          EXPECT_GORELEASER: false
        run: |
          set -euo pipefail
          echo "has_go=${EXPECT_GO:-false}" >> "$GITHUB_OUTPUT"
          echo "has_node=${EXPECT_NODE:-false}" >> "$GITHUB_OUTPUT"
          echo "has_dart=${EXPECT_DART:-false}" >> "$GITHUB_OUTPUT"
          echo "has_flutter=${EXPECT_FLUTTER:-false}" >> "$GITHUB_OUTPUT"
          echo "has_qt_cpp=${EXPECT_QT_CPP:-false}" >> "$GITHUB_OUTPUT"
          echo "has_make_c=${EXPECT_MAKE_C:-false}" >> "$GITHUB_OUTPUT"
          echo "has_docker=${EXPECT_DOCKER:-false}" >> "$GITHUB_OUTPUT"
          echo "has_goreleaser=${EXPECT_GORELEASER:-false}" >> "$GITHUB_OUTPUT"
          ([[ -d test ]] || [[ -d tests ]] || [[ -f pubspec.yaml ]]) && echo "has_dart_or_flutter_tests=true" >> "$GITHUB_OUTPUT" || echo "has_dart_or_flutter_tests=false" >> "$GITHUB_OUTPUT"
          ([[ -d packaging ]] || [[ -d pkg ]] || [[ -f debian/control ]]) && echo "has_packaging=true" >> "$GITHUB_OUTPUT" || echo "has_packaging=false" >> "$GITHUB_OUTPUT"
      - id: profile
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "profile=private" >> "$GITHUB_OUTPUT"
          else
            echo "profile=public" >> "$GITHUB_OUTPUT"
          fi

  flutter-format:
    name: Flutter format
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_flutter == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Check format
        id: check_format
        continue-on-error: true
        run: dart format --set-exit-if-changed .
      - name: Create PR if formatting failed and allowed
        if: steps.check_format.outcome == 'failure' && github.event_name == 'workflow_dispatch' && inputs.allow_prs == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dart format .
          if git diff --quiet; then
            echo "No changes; exiting."
            true
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH_NAME="ci-autofix-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "chore: auto-format"
            git push origin "$BRANCH_NAME" || true
            gh pr create               --title "chore: auto-format"               --body "Automated formatting fixes."               --base "${{ github.ref_name }}"               --head "$BRANCH_NAME"               --label "ci-autofix" || true
          fi
      - name: Fail job if formatting failed
        if: steps.check_format.outcome == 'failure'
        run: false

  flutter-analyze:
    name: Flutter analyze
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_flutter == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: Flutter test
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_flutter == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter test

  autofix:
    name: Auto-format and open PR
    needs: [route, discover]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go (if needed)
        if: ${{ needs.discover.outputs.has_go == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Node (if needed)
        if: ${{ needs.discover.outputs.has_node == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Dart/Flutter (if needed)
        if: ${{ needs.discover.outputs.has_dart == 'true' || needs.discover.outputs.has_flutter == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Run autofix formatters
        run: |
          set -euo pipefail
          if [[ "${{ needs.discover.outputs.has_go }}" == "true" ]]; then
            go fix ./... || true
            go fmt ./... || true
          fi
          if [[ "${{ needs.discover.outputs.has_node }}" == "true" ]]; then
            npm ci || true
            npx prettier . --write || true
          fi
          if [[ "${{ needs.discover.outputs.has_dart }}" == "true" || "${{ needs.discover.outputs.has_flutter }}" == "true" ]]; then
            dart format . || true
          fi
      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes; exiting."
            true
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            PARENT_PR="${{ github.event.pull_request.number || 'none' }}"
            BRANCH="ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "ci: automated formatting fixes"
            git push origin "$BRANCH" || true
            gh pr create               --title "ci: automated formatting fixes"               --body "Automated formatting pass. Parent-PR: ${PARENT_PR}"               --base main               --head "$BRANCH"               --label "ci-autofix" || true
          fi

  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --state open --search "label:ci-autofix in:title" --json number,headRefName,body |             jq -r '.[] | select(.body | contains("Parent-PR: '"$PARENT_PR"'")) | [.number, .headRefName] | @tsv' |             while IFS=$'	' read -r pr branch; do
              gh pr close "$pr" --comment "Closing auto-fix PR because parent PR #$PARENT_PR was closed."
              git push origin --delete "$branch" || true
            done

  prepare-release-tag:
    name: Prepare release tag
    needs: [route]
    if: ${{ needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-tag' }}
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            true
          elif [[ "${{ inputs.mode }}" == "publish-tag" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            true
          else
            MODE="${{ inputs.mode }}"
            OVERRIDE="${{ inputs.release_version_override }}"
            git fetch --tags --force
            if [[ -n "$OVERRIDE" ]]; then
              OVERRIDE="${OVERRIDE#v}"
              next_tag="v$OVERRIDE"
            else
              case "$MODE" in
                release-major) level="major"; suffix="" ;;
                release-minor) level="minor"; suffix="" ;;
                release-patch) level="patch"; suffix="" ;;
                release-test)  level="patch"; suffix="test" ;;
                release-rc)    level="patch"; suffix="rc" ;;
                release-alpha) level="patch"; suffix="alpha" ;;
                *) echo "Unsupported release mode: $MODE" >&2; false ;;
              esac
              args=(-print-version-only "$level")
              [[ -n "$suffix" ]] && args+=("$suffix")
              next_tag=$(git-tag-inc "${args[@]}")
            fi

            if git rev-parse "$next_tag" >/dev/null 2>&1; then
              REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$next_tag" | awk '{print $1}')
              if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
                echo "Tag $next_tag exists and points to GITHUB_SHA. Safe to retry."
              else
                echo "Tag already exists and points to $REMOTE_TAG_SHA: $next_tag" >&2
                false
              fi
            fi
            echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"
          fi

  release-validation:
    name: Release Validation Gate
    needs: [route, discover, flutter-format, flutter-analyze, flutter-test]
    if: |
      !failure() && !cancelled() &&
      needs.route.result == 'success' &&
      needs.discover.result == 'success' &&
      (needs.discover.outputs.has_flutter != 'true' || (needs.flutter-format.result == 'success' && needs.flutter-analyze.result == 'success' && needs.flutter-test.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required language checks passed."

  release-context:
    name: Release Context & Gate
    needs: [route, prepare-release-tag, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize and push tag
        id: export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-release-tag.outputs.release_tag }}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "publish-tag" ]]; then
            if [[ "${{ github.ref_type }}" != "tag" ]]; then
              echo "Error: publish-tag mode invoked on a non-tag ref." >&2
              false
            fi
            true
          else
            git fetch --tags --force
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
            if [[ -n "$REMOTE_TAG_SHA" ]]; then
              if [[ "$REMOTE_TAG_SHA" != "${GITHUB_SHA}" ]]; then
                echo "Tag $TAG exists but points to $REMOTE_TAG_SHA. Failing." >&2
                false
              fi
            else
              git tag "$TAG" "${GITHUB_SHA}"
              git push origin "$TAG" || (
                VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' || echo "failed")
                if [[ "$VERIFY_SHA" != "${GITHUB_SHA}" ]]; then
                  echo "Tag push failed." >&2
                  false
                fi
              )
            fi

            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
            fi
          fi

  flutter-build-extension:
    needs: [route, discover, flutter-format, flutter-analyze, flutter-test]
    if: ${{ needs.discover.outputs.has_flutter == 'true' && needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Extensions
        run: |
          chmod +x scripts/build_extension.sh
          ./scripts/build_extension.sh
      - name: Upload Chrome Extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: build/extension/chrome_extension.zip
          retention-days: 1
      - name: Upload Firefox Extension
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: build/extension/firefox_extension.zip
          retention-days: 1

  extension-release:
    runs-on: ubuntu-latest
    needs: [route, discover, flutter-format, flutter-analyze, flutter-test, release-context]
    if: ${{ needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Set up environment vars
        run: |
          TAG_NAME=$(echo ${{ needs.release-context.outputs.release_tag }} | sed 's/^v//')
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          wget -O yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq
          ./yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          ./yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml
      - name: Build Extensions
        run: |
          chmod +x scripts/build_extension.sh
          ./scripts/build_extension.sh
      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-release
          path: build/extension/chrome_extension.zip
          retention-days: 1
      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-release
          path: build/extension/firefox_extension.zip
          retention-days: 1

  windows:
    runs-on: windows-latest
    needs: [route, discover, flutter-format, flutter-analyze, flutter-test, release-context]
    if: ${{ needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION  }}
      - name: Set up environment vars
        run: |
          TAG_NAME=$(echo ${{ needs.release-context.outputs.release_tag }} | sed 's/^v//')
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          choco install sed make yq -y || true
          yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml
      - name: Build On Windows
        run: |
          flutter pub get
          flutter test
          flutter config --enable-windows-desktop
          dart pub global activate fastforge
          fastforge package --platform=windows --targets=exe,msix,zip
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/
          retention-days: 1

  linux:
    runs-on: ubuntu-latest
    needs: [route, discover, flutter-format, flutter-analyze, flutter-test, release-context]
    if: ${{ needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION  }}
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y appstream clang cmake desktop-file-utils fakeroot fuse gir1.2-appindicator3-0.1 libappindicator3-1 libappindicator3-dev libarchive-tools libgdk-pixbuf2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libjsoncpp25 libjsoncpp-dev libmpv-dev libnotify-bin libnotify-dev libsecret-1-0 libsecret-1-dev libunwind-dev locate make mpv ninja-build patchelf pkg-config python3-pip python3-setuptools strace tar xmlstarlet
      - name: Install AppImage Tool
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv -v appimagetool /usr/local/bin/
      - name: Set up environment vars
        run: |
          TAG_NAME=$(echo ${{ needs.release-context.outputs.release_tag }} | sed 's/^v//')
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          wget -O yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq
          ./yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          ./yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml
      - name: Secrets
        run: |
          echo "${SECRET_FILE}" | base64 -d | tar xvj
          echo "PLAYSTORE_CREDENTIALS=${PWD}/sendtolinkwarden-e713764ecb3d.json" >> $GITHUB_ENV
        env:
          SECRET_FILE: ${{ secrets.SECRET_FILE }}
      - name: Build On Linux
        run: |
          flutter pub get
          flutter test
          dart pub global activate fastforge
          fastforge package --platform=linux --targets=deb,rpm,pacman,zip
          fastforge package --platform=android --targets=apk,aab --build-target-platform=android-arm,android-arm64
          fastforge package --platform=web --targets=zip
      - name: Deploy Android to Play Store
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-test') }}
        run: |
          dart pub global activate fastforge
          fastforge release --name playstore-only
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/
          retention-days: 1
      - name: Unsecret
        run: |
          echo "${SECRET_FILE}" | base64 -d | tar -j --list | xargs rm -f || true
        env:
          SECRET_FILE: ${{ secrets.SECRET_FILE }}

  macos:
    runs-on: macos-latest
    needs: [route, discover, flutter-format, flutter-analyze, flutter-test, release-context]
    if: ${{ needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ env.FLUTTER_VERSION  }}
      - name: Dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm install --break-system-packages -g appdmg
      - name: Set version environment vars
        run: |
          TAG_NAME=$(echo ${{ needs.release-context.outputs.release_tag }} | sed 's/^v//')
          echo "SEMANTIC_VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "FLUTTER_VERSION=${TAG_NAME}+${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV
      - name: Update version number
        run: |
          brew install yq
          yq -i ".version |= \"${SEMANTIC_VERSION}+\"" pubspec.yaml
          yq -i '.version += strenv(GITHUB_RUN_NUMBER)' pubspec.yaml
      - name: Build On Mac OS X
        run: |
          flutter pub get
          flutter test
          flutter config --enable-macos-desktop
          dart pub global activate fastforge
          fastforge package --platform=macos --targets=dmg,zip
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/
          retention-days: 1

  github-release:
    name: Publish GitHub release
    needs: [route, release-context, extension-release, windows, linux, macos]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Collect release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: '*-release'
          merge-multiple: true
      - name: Create published GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ needs.release-context.outputs.release_tag }}
          prerelease: ${{ contains(needs.release-context.outputs.release_tag, '-rc') || contains(needs.release-context.outputs.release_tag, '-alpha') || contains(needs.release-context.outputs.release_tag, '-beta') || contains(needs.release-context.outputs.release_tag, '-test') }}
          generate_release_notes: true
          files: dist-release/**
